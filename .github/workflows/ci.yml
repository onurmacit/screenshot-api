name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ===========================================================================
  # Unit Tests (Essential)
  # ===========================================================================
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov pytest-mock

      - name: Run Unit Tests
        env:
          SECRET_KEY: test-secret-key-for-ci
          APP_ENV: test
        run: |
          pytest tests/unit/ -v --tb=short

  # ===========================================================================
  # Lint (Non-blocking)
  # ===========================================================================
  lint:
    name: Lint Check
    runs-on: ubuntu-latest
    continue-on-error: true  # Don't fail the pipeline
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Ruff
        run: pip install ruff

      - name: Run Ruff
        run: ruff check app/ --output-format=github || true

  # ===========================================================================
  # Build Docker Image
  # ===========================================================================
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [test]
    if: github.event_name == 'push'
    
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (API)
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Extract metadata (Go Renderer)
        id: meta-go-renderer
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-go-renderer
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.api
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Go Renderer image
        uses: docker/build-push-action@v5
        with:
          context: ./go-renderer
          file: ./go-renderer/Dockerfile
          push: true
          tags: ${{ steps.meta-go-renderer.outputs.tags }}
          labels: ${{ steps.meta-go-renderer.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ===========================================================================
  # Deploy (Automatic on main)
  # ===========================================================================
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main'
    environment: production
    
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 167.71.85.169 >> ~/.ssh/known_hosts
          ssh-keyscan -H 161.35.129.129 >> ~/.ssh/known_hosts
          ssh-keyscan -H 138.197.103.137 >> ~/.ssh/known_hosts

      - name: Deploy Worker 1
        run: |
          echo "📦 [1/3] Deploying Worker 1..."
          ssh root@167.71.85.169 << 'ENDSSH'
          cd /opt/screenshot-api
          docker compose -f docker-compose.worker-renderer.prod.yml pull 2>/dev/null || true
          docker compose -f docker-compose.worker-renderer.prod.yml up -d --build
          sleep 5
          curl -sf http://localhost:8001/health && echo " ✅ Worker 1 healthy!"
          ENDSSH

      - name: Deploy Worker 2
        run: |
          echo "📦 [2/3] Deploying Worker 2..."
          ssh root@161.35.129.129 << 'ENDSSH'
          cd /opt/screenshot-api
          docker compose -f docker-compose.worker-renderer.prod.yml pull 2>/dev/null || true
          docker compose -f docker-compose.worker-renderer.prod.yml up -d --build
          sleep 5
          curl -sf http://localhost:8001/health && echo " ✅ Worker 2 healthy!"
          ENDSSH

      - name: Deploy API
        run: |
          echo "📦 [3/3] Deploying API..."
          ssh root@138.197.103.137 << 'ENDSSH'
          cd /opt/screenshot-api
          docker compose -f docker-compose.api.hybrid.prod.yml pull 2>/dev/null || true
          docker compose -f docker-compose.api.hybrid.prod.yml up -d --build
          sleep 10
          curl -sf http://localhost:8000/api/v1/health && echo " ✅ API healthy!"
          ENDSSH

      - name: Verify Deployment
        run: |
          echo "🔍 Verifying deployment..."
          curl -sf https://api.screenshotbeam.com/api/v1/health && echo "✅ Production is live!"

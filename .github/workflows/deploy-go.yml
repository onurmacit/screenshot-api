name: Deploy Go API

on:
  push:
    branches: [ "main" ]
    paths:
      - 'api-go/**'
      - 'docker/**'
      - 'docker-compose.yml'
      - 'docker-compose.go-only.yml'
      - '.github/workflows/deploy-go.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-go

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./api-go
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Deploy to DigitalOcean
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "=== Starting Deployment ==="
            cd /root/deploy/api
            
            # Pull latest code
            git config --global --add safe.directory /root/deploy/api
            git reset --hard
            git pull https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git main
            echo "✅ Code pulled successfully"
            
            # Build locally (more reliable than GHCR pull)
            echo "Building Docker image..."
            docker compose -f docker-compose.go-only.yml build --no-cache api-go
            echo "✅ Build completed"
            
            # Restart container
            docker compose -f docker-compose.go-only.yml up -d --force-recreate api-go screenshot-nginx
            echo "✅ Container restarted"
            
            # Wait for startup
            sleep 10
            
            # Health check
            echo "Running health check..."
            if curl -sf http://localhost:8080/health > /dev/null; then
              echo "✅ Health check passed"
            else
              echo "❌ Health check failed!"
              docker logs screenshot-api-go --tail 50
              exit 1
            fi
            
            # Show recent logs
            echo "=== Recent Logs ==="
            docker logs screenshot-api-go --tail 20
            
            # Cleanup
            docker image prune -f
            echo "=== Deployment Complete ==="

name: Deploy Go API

on:
  push:
    branches: [ "main" ]
    paths:
      - 'api-go/**'
      - 'docker/**'
      - 'docker-compose.yml'
      - 'docker-compose.go-only.yml'
      - '.github/workflows/deploy-go.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-go

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./api-go
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Deploy to DigitalOcean
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Navigate to project
            cd /root/screenshot-api
            
            # Pull latest code (including updated docker-compose.yml)
            git config --global --add safe.directory /root/screenshot-api
            git reset --hard
            git pull origin main
            
            # Login to GHCR using GITHUB_TOKEN (Transient token, valid for this workflow run)
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # Pull and Restart
            docker compose -f docker-compose.go-only.yml pull api-go
            docker compose -f docker-compose.go-only.yml up -d --force-recreate api-go screenshot-nginx
            
            # Prune old images to save space
            docker image prune -f

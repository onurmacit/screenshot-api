# =============================================================================
# Screenshot API - API Droplet Deployment
# =============================================================================
# Deploy to: API droplet (138.197.103.137)
# Usage: docker compose -f docker-compose.api.yml up -d

services:
  # ===========================================================================
  # API Service (FastAPI + Uvicorn)
  # ===========================================================================
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: screenshot-api
    ports:
      - "127.0.0.1:8000:8080"
    environment:
      - APP_ENV=production
      - DEBUG=false
      - LOG_LEVEL=INFO
      - PORT=8080
    env_file:
      - .env
    restart: unless-stopped
    stop_grace_period: 30s  # Allow in-flight requests to complete before force stop
    mem_limit: 1500m
    memswap_limit: 3g
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ===========================================================================
  # Nginx Reverse Proxy (HTTPS with Let's Encrypt)
  # ===========================================================================
  nginx:
    image: nginx:alpine
    container_name: screenshot-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.ssl.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - api
    restart: unless-stopped
    stop_grace_period: 10s  # Quick shutdown for nginx
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ===========================================================================
  # Prometheus (Metrics Collection)
  # ===========================================================================
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: screenshot-prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/prometheus/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
      - '--web.enable-lifecycle'
    depends_on:
      - api
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ===========================================================================
  # Alertmanager (Alert Notifications)
  # ===========================================================================
  alertmanager:
    image: prom/alertmanager:v0.26.0
    container_name: screenshot-alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ./docker/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  prometheus_data:
  alertmanager_data:

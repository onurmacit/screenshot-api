version: '3.8'

services:
  # ===========================================================================
  # Python API (Primary - Auth, Billing, Dashboard)
  # ===========================================================================
  api:
    image: ghcr.io/onurmacit/screenshot-api:latest
    container_name: screenshot-api
    ports:
      - "127.0.0.1:8000:8080"
    environment:
      - APP_ENV=production
      - GO_RENDERER_URL=http://167.71.85.169:8001
    env_file:
      - .env.production
    restart: unless-stopped
    mem_limit: 1500m

  # ===========================================================================
  # Go API (Core Rendering - New)
  # ===========================================================================
  api-go:
    build:
      context: .
      dockerfile: api-go/Dockerfile
    image: screenshot-api-go:prod
    container_name: screenshot-api-go
    ports:
      - "127.0.0.1:8090:8080"
    environment:
      - APP_ENV=production
      - GO_RENDERER_URL=http://167.71.85.169:8001
    env_file:
      - .env.production
    restart: unless-stopped
    mem_limit: 512m
    depends_on:
      - api # Ensure db migrations run by Python first (if any)

  # ===========================================================================
  # Nginx Reverse Proxy
  # ===========================================================================
  nginx:
    image: nginx:alpine
    container_name: screenshot-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.go-migration.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - api
      - api-go
    restart: unless-stopped

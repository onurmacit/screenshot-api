# =============================================================================
# Screenshot API - Hybrid Go Renderer Droplet Deployment
# =============================================================================
# Deploy to: API droplet (138.197.103.137)
# Usage: docker compose -f docker-compose.go-renderer.prod.yml up -d
#
# This replaces Celery workers with Go Renderer microservice

services:
  # ===========================================================================
  # API Service (FastAPI Gateway)
  # ===========================================================================
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: screenshot-api
    ports:
      - "127.0.0.1:8000:8080"
    environment:
      - APP_ENV=production
      - DEBUG=false
      - LOG_LEVEL=INFO
      - PORT=8080
      # Go Renderer settings
      - USE_GO_RENDERER=true
      - GO_RENDERER_URL=http://go-renderer:8001
      - GO_RENDERER_TIMEOUT=60
    env_file:
      - .env
    depends_on:
      go-renderer:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: 512m
    memswap_limit: 1g
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ===========================================================================
  # Go Renderer Microservice (Replaces Celery Workers)
  # ===========================================================================
  go-renderer:
    build:
      context: ./go-renderer
      dockerfile: Dockerfile
    container_name: screenshot-go-renderer
    ports:
      - "127.0.0.1:8001:8001"
    environment:
      - PORT=8001
      - BROWSER_POOL_SIZE=2
    restart: unless-stopped
    mem_limit: 1g
    memswap_limit: 2g
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ===========================================================================
  # Nginx Reverse Proxy (HTTPS with Let's Encrypt)
  # ===========================================================================
  nginx:
    image: nginx:alpine
    container_name: screenshot-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.ssl.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - api
    restart: unless-stopped
    stop_grace_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ===========================================================================
  # Prometheus (Metrics Collection)
  # ===========================================================================
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: screenshot-prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/prometheus/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
      - '--web.enable-lifecycle'
    depends_on:
      - api
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ===========================================================================
  # Alertmanager (Alert Notifications)
  # ===========================================================================
  alertmanager:
    image: prom/alertmanager:v0.26.0
    container_name: screenshot-alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ./docker/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  prometheus_data:
  alertmanager_data:

version: '3.8'

services:
  # Blue instance (primary)
  api-go-blue:
    image: screenshot-api-go:latest
    container_name: api-go-blue
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - .env.production
    environment:
      - APP_ENV=production
      - INSTANCE_COLOR=blue
    volumes:
      - /var/log/screenshot-api/blue:/var/log/app
    mem_limit: 512m
    mem_reservation: 256m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - app-network
  
  # Green instance (standby)
  api-go-green:
    image: screenshot-api-go:latest
    container_name: api-go-green
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8080"
    env_file:
      - .env.production
    environment:
      - APP_ENV=production
      - INSTANCE_COLOR=green
    volumes:
      - /var/log/screenshot-api/green:/var/log/app
    mem_limit: 512m
    mem_reservation: 256m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - app-network
    profiles:
      - standby
  
  # Nginx reverse proxy with blue-green switching
  nginx:
    image: nginx:alpine
    container_name: screenshot-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.production.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx-blue-green.conf:/etc/nginx/conf.d/upstream.conf:rw
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/log/nginx:/var/log/nginx
    depends_on:
      - api-go-blue
    networks:
      - app-network
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
  
  # Prometheus for metrics (optional but recommended)
  prometheus:
    image: prom/prometheus:latest
    container_name: screenshot-prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    networks:
      - app-network
    profiles:
      - monitoring
  
  # Grafana for dashboards (optional)
  grafana:
    image: grafana/grafana:latest
    container_name: screenshot-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana-dashboards:/etc/grafana/provisioning/dashboards:ro
    networks:
      - app-network
    depends_on:
      - prometheus
    profiles:
      - monitoring
  
  # Alertmanager for alerts (optional)
  alertmanager:
    image: prom/alertmanager:latest
    container_name: screenshot-alertmanager
    restart: unless-stopped
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
    networks:
      - app-network
    profiles:
      - monitoring

networks:
  app-network:
    driver: bridge

volumes:
  prometheus-data:
  grafana-data:

# =============================================================================
# Screenshot API - Worker Droplet (Go Renderer)
# =============================================================================
# Deploy to: Worker droplet (167.71.85.169)
# Usage: docker compose -f docker-compose.worker-renderer.prod.yml up -d
#
# This runs ONLY the Go Renderer microservice with a larger browser pool

services:
  # ===========================================================================
  # Go Renderer Microservice
  # ===========================================================================
  go-renderer:
    build:
      context: ./go-renderer
      dockerfile: Dockerfile
    container_name: screenshot-go-renderer
    ports:
      # Expose for API droplet to connect
      - "0.0.0.0:8001:8001"
    environment:
      - PORT=8001
      # Increased pool size for 4GB RAM server (approx 500MB per instance)
      - BROWSER_POOL_SIZE=6
    restart: unless-stopped
    # Higher limits for dedicated worker
    mem_limit: 3500m
    memswap_limit: 4g
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

version: '3.8'

services:
  # ===========================================================================
  # Go API (Primary - All Functionality)
  # ===========================================================================
  api-go:
    build:
      context: ./api-go
      dockerfile: Dockerfile
    image: screenshot-api-go:prod
    container_name: screenshot-api-go
    ports:
      - "127.0.0.1:8090:8080"
    environment:
      - APP_ENV=production
      - GO_RENDERER_URL=http://167.71.85.169:8001
    env_file:
      - .env.production
    restart: unless-stopped
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1

  # ===========================================================================
  # Nginx Reverse Proxy
  # ===========================================================================
  nginx:
    image: nginx:alpine
    container_name: screenshot-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.go-only.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - api-go
    restart: unless-stopped

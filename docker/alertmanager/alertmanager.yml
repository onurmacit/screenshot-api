# Alertmanager Configuration
# Mailgun SMTP for email notifications (port 2525 - not blocked by DigitalOcean)

global:
  resolve_timeout: 5m
  # Mailgun SMTP Configuration
  smtp_smarthost: 'smtp.mailgun.org:2525'
  smtp_from: 'alerts@sandbox3eb7ceeede09465b9a90dcefaf03ec83.mailgun.org'
  smtp_auth_username: 'alerts@sandbox3eb7ceeede09465b9a90dcefaf03ec83.mailgun.org'
  smtp_auth_password: '10199e85f0f63a34455677c24ad47226-f6d80573-049661c4'
  smtp_require_tls: true

route:
  group_by: ['alertname', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'email-notifications'
  
  routes:
    # Critical alerts - immediate notification
    - match:
        severity: critical
      receiver: 'email-notifications'
      repeat_interval: 1h
    
    # Warning alerts - less frequent
    - match:
        severity: warning
      receiver: 'email-notifications'
      repeat_interval: 4h

receivers:
  - name: 'email-notifications'
    email_configs:
      - to: 'onurmaciit@gmail.com'
        send_resolved: true
        headers:
          subject: '[ScreenshotBeam] {{ .Status | toUpper }}: {{ .CommonLabels.alertname }}'

templates: []

inhibit_rules:
  - source_match:
      alertname: 'APIDown'
    target_match:
      alertname: 'HighLatency'
    equal: ['instance']
  
  - source_match:
      alertname: 'APIDown'
    target_match:
      alertname: 'HighErrorRate'
    equal: ['instance']

# Alertmanager Configuration
# Email notifications for alerts

global:
  resolve_timeout: 5m
  # SMTP Configuration - Gmail
  smtp_smarthost: 'smtp.gmail.com:587'
  smtp_from: 'onurmaciit@gmail.com'
  smtp_auth_username: 'onurmaciit@gmail.com'
  smtp_auth_password: 'ahgqbucrwhdoztzp'
  smtp_require_tls: true

route:
  group_by: ['alertname', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'email-notifications'
  
  routes:
    # Critical alerts - immediate notification
    - match:
        severity: critical
      receiver: 'email-notifications'
      repeat_interval: 1h
    
    # Warning alerts - less frequent
    - match:
        severity: warning
      receiver: 'email-notifications'
      repeat_interval: 4h

receivers:
  - name: 'email-notifications'
    email_configs:
      - to: 'onurmaciit@gmail.com'
        send_resolved: true
        headers:
          subject: '{{ template "email.default.subject" . }}'

# Custom email templates
templates: []

inhibit_rules:
  # If API is down, don't also send high latency alerts
  - source_match:
      alertname: 'APIDown'
    target_match:
      alertname: 'HighLatency'
    equal: ['instance']
  
  # If API is down, don't also send high error rate alerts  
  - source_match:
      alertname: 'APIDown'
    target_match:
      alertname: 'HighErrorRate'
    equal: ['instance']

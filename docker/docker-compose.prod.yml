# =============================================================================
# Screenshot API - Docker Compose (Production)
# =============================================================================
# Usage: docker-compose -f docker-compose.prod.yml up -d

services:
  # ===========================================================================
  # API Service (Multiple Replicas)
  # ===========================================================================
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    image: screenshot-api:latest
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: "2"
          memory: 4G
        reservations:
          cpus: "1"
          memory: 2G
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    environment:
      - APP_ENV=production
      - DEBUG=false
      - SECRET_KEY=${SECRET_KEY}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_S3_BUCKET=${AWS_S3_BUCKET}
      - AWS_REGION=${AWS_REGION}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - SENTRY_DSN=${SENTRY_DSN}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - screenshot-network
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"

  # ===========================================================================
  # Celery Worker - High Priority (Pro/Business)
  # ===========================================================================
  worker-high:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    image: screenshot-worker:latest
    command: celery -A app.workers.celery_app worker --loglevel=warning -Q high_priority -c 4
    deploy:
      replicas: 5
      resources:
        limits:
          cpus: "4"
          memory: 8G
        reservations:
          cpus: "2"
          memory: 4G
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    environment:
      - APP_ENV=production
      - DEBUG=false
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_S3_BUCKET=${AWS_S3_BUCKET}
      - AWS_REGION=${AWS_REGION}
    networks:
      - screenshot-network
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"

  # ===========================================================================
  # Celery Worker - Default (Starter)
  # ===========================================================================
  worker-default:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    image: screenshot-worker:latest
    command: celery -A app.workers.celery_app worker --loglevel=warning -Q default -c 2
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: "4"
          memory: 8G
        reservations:
          cpus: "2"
          memory: 4G
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    environment:
      - APP_ENV=production
      - DEBUG=false
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_S3_BUCKET=${AWS_S3_BUCKET}
      - AWS_REGION=${AWS_REGION}
    networks:
      - screenshot-network
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"

  # ===========================================================================
  # Celery Worker - Low Priority (Free)
  # ===========================================================================
  worker-low:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    image: screenshot-worker:latest
    command: celery -A app.workers.celery_app worker --loglevel=warning -Q low_priority -c 1
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "2"
          memory: 4G
        reservations:
          cpus: "1"
          memory: 2G
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    environment:
      - APP_ENV=production
      - DEBUG=false
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_S3_BUCKET=${AWS_S3_BUCKET}
      - AWS_REGION=${AWS_REGION}
    networks:
      - screenshot-network
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"

  # ===========================================================================
  # Celery Worker - Webhooks & Maintenance
  # ===========================================================================
  worker-webhooks:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    image: screenshot-worker:latest
    command: celery -A app.workers.celery_app worker --loglevel=warning -Q webhooks,cleanup,billing -c 4
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "2"
          memory: 4G
        reservations:
          cpus: "1"
          memory: 2G
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    environment:
      - APP_ENV=production
      - DEBUG=false
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_S3_BUCKET=${AWS_S3_BUCKET}
      - AWS_REGION=${AWS_REGION}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
    networks:
      - screenshot-network
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"

  # ===========================================================================
  # Celery Beat (Scheduler) - Single Instance
  # ===========================================================================
  beat:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    image: screenshot-worker:latest
    command: celery -A app.workers.celery_app beat --loglevel=warning
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    environment:
      - APP_ENV=production
      - DEBUG=false
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}
    networks:
      - screenshot-network
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  # ===========================================================================
  # Nginx Load Balancer (Optional - use if not using external LB)
  # ===========================================================================
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - api
    networks:
      - screenshot-network
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

# =============================================================================
# Networks
# =============================================================================
networks:
  screenshot-network:
    driver: overlay
    attachable: true

# =============================================================================
# Note: In production, use external managed services for:
# - PostgreSQL (AWS RDS, Google Cloud SQL, etc.)
# - Redis (AWS ElastiCache, Redis Cloud, etc.)
# - S3 (AWS S3, not MinIO)
# =============================================================================


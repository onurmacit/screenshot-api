# Blue-Green Upstream Configuration
# This file is automatically updated by deployment script

upstream api_backend {
    # Active instance (updated during deployment)
    server api-go-blue:8080 max_fails=3 fail_timeout=30s;
    
    # Standby instance (commented out)
    # server api-go-green:8080 max_fails=3 fail_timeout=30s;
    
    keepalive 32;
}

# Health check upstream (checks both instances)
upstream health_check {
    server api-go-blue:8080;
    server api-go-green:8080 backup;
}

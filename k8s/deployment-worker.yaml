---
# Celery Beat (Single instance)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: screenshot-beat
  namespace: screenshot-api
  labels:
    app: screenshot-api
    component: beat
spec:
  replicas: 1  # Must be 1 - beat should only run once
  selector:
    matchLabels:
      app: screenshot-api
      component: beat
  template:
    metadata:
      labels:
        app: screenshot-api
        component: beat
    spec:
      serviceAccountName: screenshot-api
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      
      containers:
        - name: beat
          image: your-registry/screenshot-worker:latest
          imagePullPolicy: Always
          
          command:
            - celery
            - -A
            - app.workers.celery_app
            - beat
            - --loglevel=warning
          
          envFrom:
            - configMapRef:
                name: screenshot-api-config
            - secretRef:
                name: screenshot-api-secrets
          
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"


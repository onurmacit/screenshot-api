# =============================================================================
# Screenshot API - Worker Deployment
# =============================================================================

# High Priority Worker
apiVersion: apps/v1
kind: Deployment
metadata:
  name: screenshot-worker-high
  namespace: screenshot-api
  labels:
    app: screenshot-api
    component: worker
    priority: high
spec:
  replicas: 5
  selector:
    matchLabels:
      app: screenshot-api
      component: worker
      priority: high
  template:
    metadata:
      labels:
        app: screenshot-api
        component: worker
        priority: high
    spec:
      serviceAccountName: screenshot-api
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      
      containers:
        - name: worker
          image: your-registry/screenshot-worker:latest
          imagePullPolicy: Always
          
          command:
            - celery
            - -A
            - app.workers.celery_app
            - worker
            - --loglevel=warning
            - -Q
            - high_priority
            - -c
            - "4"
          
          envFrom:
            - configMapRef:
                name: screenshot-api-config
            - secretRef:
                name: screenshot-api-secrets
          
          resources:
            requests:
              cpu: "1"
              memory: "2Gi"
            limits:
              cpu: "4"
              memory: "8Gi"
          
          livenessProbe:
            exec:
              command:
                - celery
                - -A
                - app.workers.celery_app
                - inspect
                - ping
                - -d
                - celery@$HOSTNAME
            initialDelaySeconds: 30
            periodSeconds: 60
            timeoutSeconds: 10
            failureThreshold: 3


global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'production'
    environment: 'prod'

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - '/etc/prometheus/alerts/*.yml'

scrape_configs:
  # Screenshot API - Blue instance
  - job_name: 'api-blue'
    static_configs:
      - targets: ['api-go-blue:8080']
    metrics_path: '/metrics'
    scrape_interval: 10s
  
  # Screenshot API - Green instance
  - job_name: 'api-green'
    static_configs:
      - targets: ['api-go-green:8080']
    metrics_path: '/metrics'
    scrape_interval: 10s
  
  # Nginx metrics (requires nginx-prometheus-exporter)
  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx-exporter:9113']
  
  # Node exporter (system metrics)
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']
  
  # cAdvisor (container metrics)
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
  
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
